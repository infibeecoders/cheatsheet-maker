<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Infibee Cheatsheet Creator</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fffaf0;--card:#fff;--ink:#1f2433;--muted:#667085;--line:#f0e3c4;--brand:#f5a300;--brand2:#7c3aed;--shadow:0 4px 14px rgba(60,40,0,.08);
--c0:#fff1d6;--c1:#e3f2ff;--c2:#e6f9ec;--c3:#fde8f3;--c4:#efe7ff;--c5:#ffe9e0;
--b0:#f5a300;--b1:#2b8cf0;--b2:#1fa855;--b3:#e0449a;--b4:#7c3aed;--b5:#ee6a33}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161d;--card:#1d2029;--ink:#eef0f6;--muted:#a0a7b8;--line:#2d3140;--shadow:0 4px 14px rgba(0,0,0,.4);
--c0:#3a2e12;--c1:#13293f;--c2:#13331f;--c3:#3b1a2e;--c4:#2a1f45;--c5:#3d2216}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Poppins","Segoe UI",system-ui,sans-serif;line-height:1.5}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.logo{display:flex;align-items:center;gap:10px}
.logo img{height:88px;width:auto;background:#fff;border-radius:16px;padding:4px;box-shadow:var(--shadow)}
.logo b{font-size:20px;line-height:1.1}.logo small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.hero{background:linear-gradient(135deg,#ffd45c,#f5a300 55%,#ee6a33);color:#2b1a00;border-radius:22px;padding:22px;box-shadow:var(--shadow)}
.hero h1{margin:0 0 4px;font-size:clamp(22px,4vw,32px)}.hero p{margin:0 0 14px;opacity:.85}
.form{display:flex;gap:8px;flex-wrap:wrap}
.form input,.form select{border:0;border-radius:14px;padding:13px 14px;font:inherit;background:#fff;color:#1f2433;min-width:0}
.form input{flex:1 1 240px}.form select{flex:0 1 160px}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:13px 20px;font-weight:600}
.go{background:#1f2433;color:#fff}.go:disabled{opacity:.6;cursor:wait}
.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);padding:9px 14px;font-size:14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.chips button{background:rgba(255,255,255,.55);padding:6px 12px;font-size:13px;color:#2b1a00}
#status{margin:16px 0;color:var(--muted);text-align:center}
.bar{display:none;gap:8px;margin:16px 0 0;flex-wrap:wrap}
.sheet{margin-top:14px}
.sheet-head{background:var(--card);border-radius:20px;padding:18px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;border:1px solid var(--line)}
.sheet-head .em{font-size:44px}.sheet-head h2{margin:0;font-size:clamp(20px,3.5vw,28px)}.sheet-head p{margin:2px 0 0;color:var(--muted)}
.sheet-head .lg{margin-left:auto}.sheet-head .lg img{height:84px;width:auto;background:#fff;border-radius:14px;padding:3px;border:1px solid var(--line)}
.grid{columns:2 300px;column-gap:14px;margin-top:14px}
.card{break-inside:avoid;border-radius:18px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow);border:2px solid transparent}
.card h3{margin:0 0 8px;font-size:17px;display:flex;gap:8px;align-items:center}
.card ul{margin:0;padding-left:20px}.card li{margin:4px 0}
.card.k0{background:var(--c0);border-color:var(--b0)}.card.k1{background:var(--c1);border-color:var(--b1)}
.card.k2{background:var(--c2);border-color:var(--b2)}.card.k3{background:var(--c3);border-color:var(--b3)}
.card.k4{background:var(--c4);border-color:var(--b4)}.card.k5{background:var(--c5);border-color:var(--b5)}
.term{display:grid;grid-template-columns:auto 1fr;gap:4px 10px}.term b{white-space:nowrap}
.formula{font-family:ui-monospace,Menlo,monospace;background:rgba(255,255,255,.55);color:#1f2433;border-radius:8px;padding:4px 8px;display:block;margin:4px 0}
.ex{background:rgba(255,255,255,.5);color:#1f2433;border-radius:10px;padding:8px 10px;margin:6px 0}
.mistake li::marker{content:"⚠️ "}.parent li::marker{content:"💡 "}
.quiz details{background:rgba(255,255,255,.5);color:#1f2433;border-radius:10px;padding:8px 10px;margin:6px 0}
.quiz summary{cursor:pointer;font-weight:600}
.code{background:#14182b;color:#e8ecff;border-radius:12px;margin:8px 0;overflow:hidden;border:1px solid #2d3355}
.code .ch{display:flex;justify-content:space-between;gap:8px;background:#222849;color:#ffd45c;padding:6px 12px;font-size:12px;font-weight:600}
.code pre{margin:0;padding:12px;overflow-x:auto;tab-size:4;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;line-height:1.55;white-space:pre}
.code .out{border-top:1px dashed #3b4373;padding:8px 12px;font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:#9fe3b0;white-space:pre-wrap}
.code-note{font-size:13px;margin:6px 0 0}
.pdf-mode{width:780px;background:#fffaf0;padding:8px}
.pdf-mode .grid{columns:1}
.pdf-mode .code pre{white-space:pre-wrap;overflow:visible;word-break:break-word}
.go2{background:#7c3aed;color:#fff;padding:9px 16px;font-size:14px}
.sheet-head .lg{flex-shrink:0}.sheet-head .lg img,.logo img{display:block}
.stacks{display:flex;flex-wrap:wrap;gap:18px 22px}.stackbox{flex:1 1 250px;min-width:230px}
.stackbox h4{margin:0 0 8px;font-size:14px}
.stack{overflow-x:auto;padding:2px 0}
#pdfRoot{position:fixed;left:-10000px;top:0;width:720px;--card:#fff;--ink:#1f2433;--muted:#667085;--line:#f0e3c4;--c0:#fff1d6;--c1:#e3f2ff;--c2:#e6f9ec;--c3:#fde8f3;--c4:#efe7ff;--c5:#ffe9e0;color:#1f2433;line-height:1.5}
#pdfRoot .pp{width:720px;background:#fffaf0;padding:2px}
#pdfRoot .card,#pdfRoot .sheet-head{margin:0;box-shadow:none}
#pdfRoot .code pre{white-space:pre-wrap;overflow:visible;word-break:break-word}
.foot{text-align:center;color:var(--muted);font-size:12px;margin:10px 0 20px}
.err{color:#c0392b}
@media print{.hero,.bar,#status,.chips,header.top .ghost{display:none!important}body{background:#fff}.card{box-shadow:none}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
 <div class="logo" id="logoBox"></div>
</header>

<section class="hero">
 <h1>📝 Cheatsheet Creator</h1>
 <p>Type any topic and get a colourful, detailed cheatsheet for students and parents.</p>
 <div class="form">
  <input id="topic" placeholder="e.g. Photosynthesis, Fractions, Python loops, Indian Constitution" maxlength="120">
  <select id="level">
   <option>Class 1-5</option><option selected>Class 6-8</option><option>Class 9-10</option><option>Class 11-12</option><option>College</option>
  </select>
  <button class="go" id="go">✨ Create</button>
 </div>
 <div class="chips" id="chips"></div>
</section>

<div id="status"></div>
<div class="bar" id="bar">
 <button class="go2" id="pdf">📄 Download PDF</button>
 <button class="ghost" id="print">🖨️ Print / Save PDF</button>
 <button class="ghost" id="save">⬇️ Download HTML</button>
</div>
<main class="sheet" id="sheet"></main>
<div class="foot">Made with ❤️ by Infibee Coders</div>
</div>

const PROMPT=(topic,level)=>`You create student-friendly cheatsheets. Topic: "${topic}". Audience: ${level} students and their parents.
SCOPE RULE: cover ONLY the exact topic "${topic}". Do not add related or neighbouring topics, other chapters, prerequisites, history or general study tips. If the topic is narrow, go deep on it instead of going broad. Every section, term, example, mistake, parent tip, quiz question, code example and block script must be directly about this topic.
Return ONLY valid JSON (no markdown fences) with this shape:
{"title":string,"emoji":string,"tagline":string(one friendly line),
"sections":[{"heading":string,"emoji":string,"points":[string]}] (5-7 sections: big idea, key concepts, step-by-step how-to, real-life connections etc; each 3-6 short clear points; plain simple language),
"terms":[{"term":string,"meaning":string}] (6-10 key terms),
"formulas":[string] (key formulas/rules/syntax; empty array if none),
"examples":[{"q":string,"a":string}] (2-3 worked examples with brief steps),
"mistakes":[string] (4-5 common mistakes),
"parents":[string] (4-5 tips for parents to help at home, with simple home activities),
"quiz":[{"q":string,"a":string}] (5 quick-check questions),
"codeBlocks":[{"title":string,"language":string,"explain":string(1-2 simple sentences),"code":string,"output":string(expected output, may be empty)}] (2-4 blocks if the topic involves programming, HTML/CSS, SQL, or any code/commands; otherwise an empty array),
"blockScripts":[{"title":string,"explain":string(1-2 simple sentences),"blocks":[{"cat":"motion|looks|sound|events|control|sensing|operators|variables|myblocks","text":string,"depth":number}]}] (ONLY when the topic is block-based coding such as Scratch, Code.org, MIT App Inventor or Blockly: 3-5 small, correct scripts; otherwise an empty array)}
BLOCK RULES: write each block's text exactly like the real Scratch block. Syntax: [value] for a typed or number input slot, [name v] for a dropdown (e.g. [space v], [mouse-pointer v], [score v]), (name) for a round reporter or variable (e.g. (score), (x position)), {condition} for a hexagonal true/false condition; nesting is allowed. Examples: "when green flag clicked", "when [space v] key pressed", "go to x: [0] y: [0]", "move [10] steps", "turn right [15] degrees", "say [Hello!] for [2] seconds", "set [score v] to [0]", "change [score v] by [1]", "repeat [10]", "forever", "if {(score) > [5]} then", "set [x v] to ((score) + [1])", "wait [1] seconds". Operators (+ - * / > < = and or not) are plain text between nodes. List blocks top to bottom in execution order. depth is 0 normally and +1 for blocks placed inside a repeat/forever/if/else block; write else as its own block with text "else" at the same depth as its matching if. Start event scripts with a "when ..." block of cat events. Use only blocks that really exist on the platform. If blockScripts is used, leave formulas and codeBlocks empty.
CODE RULES: every code block must be complete, correct and runnable, with valid syntax for its language. Use real newline characters inside the JSON string (\n), never put the code on one line. Indent consistently with 4 spaces (no tabs; 2 spaces only for HTML/CSS/JSON), follow the language's standard style and naming conventions, close all brackets/quotes/tags, and keep short helpful comments. Put code ONLY in codeBlocks, never inside other fields. The "output" must exactly match what the code prints.
Be accurate, detailed yet easy, and age-appropriate. Use short sentences.`;

async function make(){
  const topic=$("topic").value.trim(); if(!topic){$("topic").focus();return;}
  const level=$("level").value;
  $("go").disabled=true;$("bar").style.display="none";$("sheet").innerHTML="";
  $("status").textContent="🐝 Buzzing through your topic… building the cheatsheet";
  try{
    const sample=await claude.use("sample");
    if(!sample){$("status").innerHTML='<span class="err">AI is not available in this view. Open the page from claude.ai and allow access.</span>';return;}
    const d=await sample.json(PROMPT(topic,level));
    render(d);$("status").textContent="";$("bar").style.display="flex";
    $("sheet").scrollIntoView({behavior:"smooth"});
  }catch(e){
    $("status").innerHTML='<span class="err">Could not create it ('+esc(e&&e.message||"error")+'). Please try again.</span>';
  }finally{$("go").disabled=false;}
}

const BC={motion:"#4c97ff",looks:"#9966ff",sound:"#cf63cf",events:"#ffbf00",control:"#ffab19",sensing:"#5cb1d6",operators:"#59c059",variables:"#ff8c1a",myblocks:"#ff6680"};
const FONT="Helvetica,Arial,sans-serif";
const mctx=document.createElement("canvas").getContext("2d");
const tw=(t,z=13)=>{mctx.font="700 "+z+"px "+FONT;return mctx.measureText(t).width;};
const shade=(h,f)=>{const n=parseInt(h.slice(1),16);return "#"+[n>>16,(n>>8)&255,n&255].map(v=>Math.max(0,Math.min(255,Math.round(v*(1+f)))).toString(16).padStart(2,"0")).join("");};
function parseB(s){let i=0;const seq=end=>{const out=[];let buf="";const fl=()=>{if(buf.trim())out.push({t:"text",s:buf.trim()});buf="";};
  while(i<s.length&&s[i]!==end){const c=s[i];
    if(c==="["){fl();let j=s.indexOf("]",i);if(j<0)j=s.length;out.push({t:"in",s:s.slice(i+1,j)});i=j+1;}
    else if(c==="("){fl();i++;out.push({t:"rep",k:seq(")")});i++;}
    else if(c==="{"){fl();i++;out.push({t:"bool",k:seq("}")});i++;}
    else{buf+=c;i++;}}
  fl();return out;};
  return seq(null);}
const flatT=k=>k.map(n=>n.t==="text"||n.t==="in"?n.s:flatT(n.k)).join(" ");
function repCol(o){
  if(/position|direction/i.test(o))return BC.motion;
  if(/costume|size|backdrop/i.test(o))return BC.looks;
  if(/answer|mouse|touching|key|timer|distance|loudness/i.test(o))return BC.sensing;
  if(/[+\-*\/<>=]|\b(and|or|not|mod|round|join|pick random|letter|length of|abs|sqrt)\b/i.test(o))return BC.operators;
  return BC.variables;}
function lay(nodes,col){
  const its=nodes.map(n=>{
    if(n.t==="text")return{w:tw(n.s),h:16,d:(x,y)=>`<text x="${x}" y="${y+12.5}" font-size="13" font-weight="700" fill="#fff" font-family="${FONT}">${esc(n.s)}</text>`};
    const num=n.t==="rep"&&n.k.length&&n.k.every(q=>q.t==="text")&&/^-?[\d.]+$/.test(flatT(n.k).trim());
    if(n.t==="in"||num){let t=n.t==="in"?n.s:flatT(n.k).trim();const dd=n.t==="in"&&/ v$/.test(t);if(dd)t=t.slice(0,-2);
      const w=Math.max(32,tw(t,12)+(dd?36:22)),h=26;
      return{w,h,d:(x,y)=>dd?`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="6" fill="${shade(col,-.15)}" stroke="${shade(col,-.35)}"/><text x="${x+10}" y="${y+17}" font-size="12" font-weight="700" fill="#fff" font-family="${FONT}">${esc(t)}</text><path d="M${x+w-19} ${y+11}l5 6 5-6z" fill="#fff"/>`
        :`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="13" fill="#fff" stroke="${shade(col,-.3)}"/><text x="${x+w/2}" y="${y+17}" text-anchor="middle" font-size="12" font-weight="700" fill="#575e75" font-family="${FONT}">${esc(t)}</text>`};}
    const own=n.k.filter(q=>q.t==="text").map(q=>q.s).join(" "),c=repCol(own),inn=lay(n.k,c);
    if(n.t==="rep"){const h=Math.max(28,inn.h+8),w=inn.w+22;return{w,h,d:(x,y)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${h/2}" fill="${c}" stroke="${shade(c,-.25)}"/>`+inn.d(x+11,y+(h-inn.h)/2)};}
    const h=Math.max(30,inn.h+8),w=inn.w+h+4,r=h/2;
    return{w,h,d:(x,y)=>`<polygon points="${x+r},${y} ${x+w-r},${y} ${x+w},${y+r} ${x+w-r},${y+h} ${x+r},${y+h} ${x},${y+r}" fill="${c}" stroke="${shade(c,-.25)}"/>`+inn.d(x+r+2,y+(h-inn.h)/2)};
  });
  const gap=7,w=its.reduce((a,b)=>a+b.w,0)+gap*Math.max(0,its.length-1),h=Math.max(16,...its.map(i=>i.h));
  return{w,h,d:(x,y)=>{let cx=x,o="";for(const i of its){o+=i.d(cx,y+(h-i.h)/2);cx+=i.w+gap;}return o;}};
}
function tree(list){const root=[],lv=[root],last=[];
  for(const b of list||[]){const d=Math.max(0,Math.min(+b.depth||0,5)),t=String(b.text||"").trim();
    if(/^else$/i.test(t)){const p=last[d];if(p){p.secs=p.secs||[[]];const s=[];p.secs.push(s);lv[d+1]=s;lv.length=d+2;}continue;}
    if(!lv[d]){const p=last[d-1];if(p){if(!p.secs)p.secs=[[]];lv[d]=p.secs[p.secs.length-1];}else lv[d]=lv[Math.max(0,d-1)]||root;}
    const n={cat:b.cat,text:t,secs:null};lv[d].push(n);last[d]=n;lv.length=d+1;last.length=d+1;}
  return root;}
function drawNode(n){
  const cat=String(n.cat||"motion").toLowerCase(),col=BC[cat]||BC.motion,txt=String(n.text||"").trim(),st=shade(col,-.25);
  const isC=n.secs||/^(forever|repeat|if\b)/i.test(txt);
  if(!isC){
    const hat=(cat==="events"&&/^when/i.test(txt))||/^define /i.test(txt);
    const L=lay(parseB(txt),col),rh=Math.max(38,L.h+16),cap=hat?26:0,H=cap+rh,W=Math.max(hat?120:64,L.w+26);
    const top=hat?`M0,26C12,8 36,0 62,0S108,8 118,26H${W-4}Q${W},26 ${W},30`:`M4,0H16L20,4H32L36,0H${W-4}Q${W},0 ${W},4`;
    const d=top+`V${H-4}Q${W},${H} ${W-4},${H}H36L32,${H+4}H20L16,${H}H4Q0,${H} 0,${H-4}`+(hat?"Z":"V4Q0,0 4,0Z");
    return{w:W,h:H,svg:`<path d="${d}" fill="${col}" stroke="${st}"/>`+L.d(13,cap+(rh-L.h)/2)};
  }
  const A=18,secs=n.secs||[[]];let y=0,W=70,kw=0,body="";const geo=[];
  secs.forEach((kids,i)=>{const L=lay(parseB(i?"else":txt),col),ht=Math.max(i?32:38,L.h+16),r=renderList(kids),hc=Math.max(26,r.h);
    W=Math.max(W,L.w+26);kw=Math.max(kw,r.w);geo.push({y,ht,hc});
    body+=L.d(13,y+(ht-L.h)/2)+`<g transform="translate(${A},${y+ht})">${r.svg}</g>`;y+=ht+hc;});
  const Hf=26,FW=Math.min(W,84);let d="M4,0H16L20,4H32L36,0";
  geo.forEach(g=>{const b=g.y+g.ht,e=b+g.hc;d+=`H${W-4}Q${W},${g.y} ${W},${g.y+4}V${b-4}Q${W},${b} ${W-4},${b}H${A+36}L${A+32},${b+4}H${A+20}L${A+16},${b}H${A+4}Q${A},${b} ${A},${b+4}V${e-4}Q${A},${e} ${A+4},${e}`;});
  d+=`H${FW-4}Q${FW},${y} ${FW},${y+4}V${y+Hf-4}Q${FW},${y+Hf} ${FW-4},${y+Hf}H36L32,${y+Hf+4}H20L16,${y+Hf}H4Q0,${y+Hf} 0,${y+Hf-4}V4Q0,0 4,0Z`;
  return{w:Math.max(W,A+kw),h:y+Hf,svg:`<path d="${d}" fill="${col}" stroke="${st}"/>`+body};
}
function renderList(list){let y=0,w=0,svg="";for(const n of list){const b=drawNode(n);svg+=`<g transform="translate(0,${y})">${b.svg}</g>`;y+=b.h;w=Math.max(w,b.w);}return{svg,w,h:y};}
function scriptSVG(flat){const r=renderList(tree(flat)),W=Math.ceil(r.w+14),H=Math.ceil(r.h+16);return `<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="max-width:100%;height:auto"><g transform="translate(6,6)">${r.svg}</g></svg>`;}
function render(d){
  let n=0;const k=()=>"k"+(n++%6);
  let h=`<div class="sheet-head"><div class="em">${esc(d.emoji||"📘")}</div><div><h2>${esc(d.title)}</h2><p>${esc(d.tagline)}</p></div><div class="lg">${logoHTML}</div></div><div class="grid">`;
  (d.sections||[]).forEach(s=>{
    h+=`<div class="card ${k()}"><h3><span>${esc(s.emoji||"📌")}</span>${esc(s.heading)}</h3><ul>${(s.points||[]).map(p=>`<li>${esc(p)}</li>`).join("")}</ul></div>`;
  });
  if((d.codeBlocks||[]).length) h+=`<div class="card ${k()}" style="column-span:all"><h3>💻 Code Examples</h3>${d.codeBlocks.map(cb=>{const code=String(cb.code||"").replace(/\r/g,"").replace(/\t/g,"    ").replace(/^\n+|\s+$/g,"");return `<div class="code"><div class="ch"><span>${esc(cb.title)}</span><span>${esc(cb.language)}</span></div><pre><code>${esc(code)}</code></pre>${cb.output?`<div class="out">▶ Output:\n${esc(cb.output)}</div>`:""}</div>${cb.explain?`<p class="code-note">${esc(cb.explain)}</p>`:""}`}).join("")}</div>`;
  if((d.terms||[]).length) h+=`<div class="card ${k()}"><h3>📚 Key Terms</h3><div class="term">${d.terms.map(t=>`<b>${esc(t.term)}</b><span>${esc(t.meaning)}</span>`).join("")}</div></div>`;
  if((d.blockScripts||[]).length) h+=`<div class="card ${k()}" style="column-span:all"><h3>🧩 Block Coding Scripts</h3><div class="stacks">${d.blockScripts.map(b=>`<div class="stackbox"><h4>${esc(b.title)}</h4><div class="stack">${scriptSVG(b.blocks)}</div>${b.explain?`<p class="code-note">${esc(b.explain)}</p>`:""}</div>`).join("")}</div></div>`;
  if((d.formulas||[]).length&&!(d.blockScripts||[]).length) h+=`<div class="card ${k()}"><h3>🧮 Formulas &amp; Rules</h3>${d.formulas.map(f=>`<code class="formula">${esc(f)}</code>`).join("")}</div>`;
  if((d.examples||[]).length) h+=`<div class="card ${k()}"><h3>✏️ Worked Examples</h3>${d.examples.map(x=>`<div class="ex"><b>Q:</b> ${esc(x.q)}<br><b>A:</b> ${esc(x.a)}</div>`).join("")}</div>`;
  if((d.mistakes||[]).length) h+=`<div class="card ${k()}"><h3>🚫 Common Mistakes</h3><ul class="mistake">${d.mistakes.map(m=>`<li>${esc(m)}</li>`).join("")}</ul></div>`;
  if((d.parents||[]).length) h+=`<div class="card ${k()}"><h3>👨‍👩‍👧 Parent Corner</h3><ul class="parent">${d.parents.map(m=>`<li>${esc(m)}</li>`).join("")}</ul></div>`;
  if((d.quiz||[]).length) h+=`<div class="card ${k()} quiz"><h3>🎯 Quick Check (tap to reveal)</h3>${d.quiz.map((x,i)=>`<details><summary>${i+1}. ${esc(x.q)}</summary>✅ ${esc(x.a)}</details>`).join("")}</div>`;
  h+=`</div>`;
  $("sheet").innerHTML=h;
}

$("print").onclick=()=>window.print();
$("pdf").onclick=async()=>{
  const btn=$("pdf"),old=btn.textContent;
  btn.disabled=true;btn.textContent="⏳ Making PDF…";
  const root=document.createElement("div");root.id="pdfRoot";document.body.appendChild(root);
  try{
    const dl=await claude.use("downloads");
    if(!dl){alert("PDF download is not available in this view. Use Print / Save PDF.");return;}
    const {jsPDF}=window.jspdf;
    const doc=new jsPDF({unit:"mm",format:"a4"});
    const PW=210,PH=297,M=10,CW=PW-2*M,GAP=4,LIM=PH-M-8;
    const bg=()=>{doc.setFillColor(255,250,240);doc.rect(0,0,PW,PH,"F");};
    bg();let y=M;
    const pieces=[$("sheet").querySelector(".sheet-head"),...$("sheet").querySelectorAll(".card")];
    for(const p of pieces){
      const w=document.createElement("div");w.className="pp";w.appendChild(p.cloneNode(true));
      w.querySelectorAll("details").forEach(x=>x.open=true);
      root.appendChild(w);
      await new Promise(r=>setTimeout(r,40));
      const cv=await html2canvas(w,{scale:2,backgroundColor:"#fffaf0",useCORS:true});
      root.removeChild(w);
      const h=cv.height*CW/cv.width;
      if(h<=LIM-M){
        if(y+h>LIM){doc.addPage();bg();y=M;}
        doc.addImage(cv.toDataURL("image/jpeg",.95),"JPEG",M,y,CW,h);y+=h+GAP;
      }else{
        if(y>M+1){doc.addPage();bg();y=M;}
        const maxPx=Math.floor((LIM-M)*cv.width/CW);let sy=0;
        while(sy<cv.height){
          const sh=Math.min(maxPx,cv.height-sy),c2=document.createElement("canvas");
          c2.width=cv.width;c2.height=sh;c2.getContext("2d").drawImage(cv,0,sy,cv.width,sh,0,0,cv.width,sh);
          const hh=sh*CW/cv.width;doc.addImage(c2.toDataURL("image/jpeg",.95),"JPEG",M,y,CW,hh);y+=hh+GAP;sy+=sh;
          if(sy<cv.height){doc.addPage();bg();y=M;}
        }
      }
    }
    const n=doc.getNumberOfPages();
    for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(8);doc.setTextColor(130);doc.text("Made by Infibee Coders  |  Page "+i+" of "+n,PW/2,PH-5,{align:"center"});}
    const blob=doc.output("blob");
    await dl.save({filename:($("topic").value.trim().replace(/[^\w]+/g,"-")||"cheatsheet")+"-cheatsheet.pdf",data:blob});
  }catch(e){if(!(e&&e.code==="declined"))alert("Could not create the PDF. Please try Print / Save PDF.");}
  finally{root.remove();btn.disabled=false;btn.textContent=old;}
};
$("save").onclick=async()=>{
  try{
    const dl=await claude.use("downloads");
    if(!dl){alert("Download is not available here. Use Print / Save PDF.");return;}
    const css=document.querySelector("style").textContent;
    const html=`<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc($("topic").value)} Cheatsheet</title><style>${css}</style></head><body><div class="wrap"><main class="sheet">${$("sheet").innerHTML}</main><div class="foot">Made with ❤️ by Infibee Coders</div></div></body></html>`;
    await dl.save({filename:($("topic").value.trim().replace(/[^\w]+/g,"-")||"cheatsheet")+"-cheatsheet.html",data:html});
  }catch(e){}
};
